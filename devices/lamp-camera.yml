---
- hosts: all
  vars:
    hub: "1-1"
    port: "4"
  tasks:
    - name: Install inotify-tools
      become: yes
      package:
        name: inotify-tools
        state: present

    - name: Install uhubctl from AUR
      command: yay -S --noconfirm uhubctl
      args:
        creates: /usr/bin/uhubctl

    - name: Install lamp/camera watch script
      become: yes
      template:
        src: "{{ curdir }}/files/lamp-camera-watch.sh.j2"
        dest: /usr/local/bin/lamp-camera-watch.sh
        mode: '0755'

    - name: Install lamp/camera systemd service
      become: yes
      copy:
        src: "{{ curdir }}/files/lamp-camera-watch.service"
        dest: /etc/systemd/system/lamp-camera-watch.service

    - name: Enable and start lamp/camera watch service
      become: yes
      systemd:
        name: lamp-camera-watch
        daemon_reload: yes
        enabled: yes
        state: started
